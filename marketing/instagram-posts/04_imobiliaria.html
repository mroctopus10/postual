<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post 4 — Horizonte Imobiliária</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; background: #0F1A30; }
.card {
  width: 1080px; height: 1080px;
  background: linear-gradient(160deg, #1B2A4A 0%, #0F1A30 100%);
  display: flex; flex-direction: column;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(74,124,201,0.1) 0%, transparent 70%);
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 40px 56px 24px;
  position: relative; z-index: 1;
}
.postual-logo {
  display: flex; align-items: center; gap: 8px;
}
.postual-p { font-size: 24px; font-weight: 900; color: #fff; }
.postual-dot { width: 7px; height: 7px; background: #8FA580; border-radius: 50%; margin-top: 4px; }
.postual-name { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: 1px; }
.tag {
  background: rgba(74,124,201,0.2);
  color: #6B9EE0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 8px 18px;
  border-radius: 50px;
}

.client-info {
  padding: 0 56px 28px;
  position: relative; z-index: 1;
}
.client-name {
  font-size: 48px;
  font-weight: 900;
  color: #FFFFFF;
  letter-spacing: -2px;
  line-height: 1.1;
}
.client-desc {
  font-size: 17px;
  color: #5A6880;
  margin-top: 6px;
}

.devices {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 32px;
  padding: 0 40px;
  overflow: hidden;
  position: relative; z-index: 1;
}

.laptop {
  flex: 1; max-width: 580px; height: 100%;
  display: flex; flex-direction: column;
}
.laptop-frame {
  flex: 1;
  background: #FAFBFD;
  border-radius: 14px 14px 0 0;
  border: 2px solid #333;
  border-bottom: none;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.laptop-bar {
  height: 32px;
  background: #1B2A4A;
  display: flex; align-items: center;
  padding: 0 12px; gap: 6px; flex-shrink: 0;
}
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot-r { background: #FF5F57; }
.dot-y { background: #FFBD2E; }
.dot-g { background: #28C840; }
.url {
  flex: 1; margin-left: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px; padding: 3px 10px;
  font-size: 10px; color: #6B9EE0;
}
.laptop-screen { flex: 1; overflow: hidden; }
.laptop-screen iframe {
  width: 200%; height: 200%;
  border: none;
  transform: scale(0.5);
  transform-origin: top left;
}
.laptop-base {
  height: 14px;
  background: linear-gradient(180deg, #333 0%, #222 100%);
  margin: 0 30px;
  border-radius: 0 0 6px 6px;
}

.phone {
  width: 220px; height: 420px;
  flex-shrink: 0; margin-bottom: 14px;
}
.phone-frame {
  width: 100%; height: 100%;
  background: #1A1A1A;
  border-radius: 28px; border: 3px solid #333;
  overflow: hidden;
  display: flex; flex-direction: column;
  padding: 12px 0 0;
}
.phone-notch {
  width: 80px; height: 6px;
  background: #333; border-radius: 3px;
  margin: 0 auto 8px;
}
.phone-screen {
  flex: 1; overflow: hidden;
  margin: 0 3px 3px;
  border-radius: 0 0 24px 24px;
}
.phone-screen iframe {
  width: 400%; height: 400%;
  border: none;
  transform: scale(0.25);
  transform-origin: top left;
}

.bottom {
  padding: 24px 56px 40px;
  display: flex; gap: 24px;
  position: relative; z-index: 1;
}
.stat {
  flex: 1; text-align: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(74,124,201,0.15);
  border-radius: 14px;
  padding: 18px 12px;
}
.stat-num {
  font-size: 28px;
  font-weight: 900;
  color: #6B9EE0;
}
.stat-label {
  font-size: 12px;
  color: #5A6880;
  margin-top: 2px;
}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="postual-logo">
      <span class="postual-p">p</span><span class="postual-dot"></span>
      <span class="postual-name">postual</span>
    </div>
    <div class="tag">Imobiliária</div>
  </div>

  <div class="client-info">
    <div class="client-name">Horizonte</div>
    <div class="client-desc">Website premium + listagem de imóveis no Algarve</div>
  </div>

  <div class="devices">
    <div class="laptop">
      <div class="laptop-frame">
        <div class="laptop-bar">
          <div class="dot dot-r"></div>
          <div class="dot dot-y"></div>
          <div class="dot dot-g"></div>
          <div class="url">horizonte-algarve.pt</div>
        </div>
        <div class="laptop-screen">
          <iframe src="../../demos/demo_imobiliaria.html" loading="lazy"></iframe>
        </div>
      </div>
      <div class="laptop-base"></div>
    </div>
    <div class="phone">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <iframe src="../../demos/demo_imobiliaria.html" loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="stat">
      <div class="stat-num">+180%</div>
      <div class="stat-label">Contactos online</div>
    </div>
    <div class="stat">
      <div class="stat-num">32</div>
      <div class="stat-label">Imóveis listados</div>
    </div>
    <div class="stat">
      <div class="stat-num">48h</div>
      <div class="stat-label">Site no ar</div>
    </div>
  </div>
</div>
</body>
</html>
