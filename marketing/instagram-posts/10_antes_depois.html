<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post 10 — Antes vs Depois</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; background: #0F1114; }
.card {
  width: 1080px; height: 1080px;
  background: #0F1114;
  display: flex; flex-direction: column;
  padding: 56px;
  position: relative;
}

.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px;
}
.postual-logo { display: flex; align-items: center; gap: 8px; }
.postual-p { font-size: 24px; font-weight: 900; color: #fff; }
.postual-dot { width: 7px; height: 7px; background: #8FA580; border-radius: 50%; margin-top: 4px; }
.postual-name { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: 1px; }

.title {
  font-size: 36px; font-weight: 900; color: #fff;
  letter-spacing: -1px; margin-bottom: 6px; text-align: center;
}
.subtitle {
  font-size: 17px; color: #6B7280; margin-bottom: 36px; text-align: center;
}

.comparison {
  flex: 1;
  display: flex;
  gap: 24px;
}

/* ANTES side */
.side {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-radius: 20px;
  overflow: hidden;
}
.side-antes {
  background: rgba(239,68,68,0.04);
  border: 1px solid rgba(239,68,68,0.12);
}
.side-depois {
  background: rgba(107,127,94,0.06);
  border: 1px solid rgba(107,127,94,0.15);
}

.side-header {
  padding: 16px 24px;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.side-antes .side-header { color: #F87171; background: rgba(239,68,68,0.06); }
.side-depois .side-header { color: #8FA580; background: rgba(107,127,94,0.08); }

/* Instagram grid mockup */
.ig-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 3px;
  padding: 16px;
}
.ig-cell {
  aspect-ratio: 1;
  border-radius: 4px;
}

/* Antes: ugly cells */
.antes-1 { background: linear-gradient(135deg, #2a2015, #1a150e); }
.antes-2 { background: #1a1510; }
.antes-3 { background: linear-gradient(135deg, #251c12, #1c1610); }
.antes-4 { background: #22190f; }
.antes-5 { background: linear-gradient(135deg, #1e1710, #15100a); }
.antes-6 { background: #201810; }
.antes-7 { background: linear-gradient(135deg, #2a1f14, #1a150e); }
.antes-8 { background: #1c1510; }
.antes-9 { background: linear-gradient(135deg, #251a10, #1a130c); }

/* Depois: clean professional cells */
.depois-1 { background: linear-gradient(135deg, #8FA580, #6B7F5E); }
.depois-2 { background: #1A1D20; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.depois-3 { background: linear-gradient(135deg, #C4946A, #A87B50); }
.depois-4 { background: #1A1D20; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.depois-5 { background: linear-gradient(135deg, #6B9EE0, #4A7CC9); }
.depois-6 { background: linear-gradient(135deg, #8FA580, #6B7F5E); }
.depois-7 { background: #1A1D20; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.depois-8 { background: linear-gradient(135deg, #C4946A, #A87B50); }
.depois-9 { background: linear-gradient(135deg, #6B9EE0, #4A7CC9); }

/* Stats under each */
.side-stats {
  padding: 16px 20px;
  display: flex;
  gap: 12px;
}
.side-stat {
  flex: 1;
  text-align: center;
}
.side-stat-num {
  font-size: 18px;
  font-weight: 900;
}
.side-antes .side-stat-num { color: #F87171; }
.side-depois .side-stat-num { color: #8FA580; }
.side-stat-label {
  font-size: 10px;
  color: #6B7280;
  margin-top: 2px;
}

/* VS divider */
.vs {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.vs-text {
  font-size: 20px;
  font-weight: 900;
  color: #4B5563;
  writing-mode: vertical-lr;
  letter-spacing: 4px;
}

.bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.bottom-text {
  font-size: 18px; font-weight: 700; color: #fff;
}
.bottom-text span { color: #8FA580; }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="postual-logo">
      <span class="postual-p">p</span><span class="postual-dot"></span>
      <span class="postual-name">postual</span>
    </div>
  </div>

  <div class="title">O Instagram do seu restaurante</div>
  <div class="subtitle">Parece o da esquerda ou o da direita?</div>

  <div class="comparison">
    <div class="side side-antes">
      <div class="side-header">Antes</div>
      <div class="ig-grid">
        <div class="ig-cell antes-1"></div>
        <div class="ig-cell antes-2"></div>
        <div class="ig-cell antes-3"></div>
        <div class="ig-cell antes-4"></div>
        <div class="ig-cell antes-5"></div>
        <div class="ig-cell antes-6"></div>
        <div class="ig-cell antes-7"></div>
        <div class="ig-cell antes-8"></div>
        <div class="ig-cell antes-9"></div>
      </div>
      <div class="side-stats">
        <div class="side-stat">
          <div class="side-stat-num">23</div>
          <div class="side-stat-label">Seguidores</div>
        </div>
        <div class="side-stat">
          <div class="side-stat-num">2</div>
          <div class="side-stat-label">Posts/mês</div>
        </div>
        <div class="side-stat">
          <div class="side-stat-num">3</div>
          <div class="side-stat-label">Likes avg</div>
        </div>
      </div>
    </div>

    <div class="vs">
      <div class="vs-text">VS</div>
    </div>

    <div class="side side-depois">
      <div class="side-header">Depois</div>
      <div class="ig-grid">
        <div class="ig-cell depois-1"></div>
        <div class="ig-cell depois-2">📊</div>
        <div class="ig-cell depois-3"></div>
        <div class="ig-cell depois-4">🍷</div>
        <div class="ig-cell depois-5"></div>
        <div class="ig-cell depois-6"></div>
        <div class="ig-cell depois-7">⭐</div>
        <div class="ig-cell depois-8"></div>
        <div class="ig-cell depois-9"></div>
      </div>
      <div class="side-stats">
        <div class="side-stat">
          <div class="side-stat-num">1.2K</div>
          <div class="side-stat-label">Seguidores</div>
        </div>
        <div class="side-stat">
          <div class="side-stat-num">12</div>
          <div class="side-stat-label">Posts/mês</div>
        </div>
        <div class="side-stat">
          <div class="side-stat-num">85</div>
          <div class="side-stat-label">Likes avg</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="bottom-text">A diferença? Conteúdo <span>profissional</span> e <span>consistente</span>.</div>
  </div>
</div>
</body>
</html>
